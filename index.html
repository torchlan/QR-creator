<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Creator | The Real Estate Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden relative z-10">
        
        <div class="bg-slate-50 border-b border-slate-100 py-3 px-8 text-center">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">Powered by</p>
            <p class="text-xs font-extrabold text-blue-900 uppercase tracking-widest">The Real Estate Network</p>
        </div>

        <div class="p-8 text-center">
            <h1 class="text-2xl font-bold text-slate-800 mb-2 uppercase tracking-tight">QR Code Creator</h1>
            <p class="text-slate-400 text-[11px] mb-8 uppercase tracking-[0.2em]">Professional Utility</p>
            
            <div class="space-y-4 mb-6 text-left">
                <input type="text" id="target-url" placeholder="Paste link here..." 
                    class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 ring-blue-500 transition-all text-sm">
                
                <button onclick="generateQR()" 
                    class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-100">
                    Generate QR Code
                </button>
            </div>

            <div id="qr-result" class="hidden animate-in fade-in zoom-in duration-300">
                <div class="bg-white p-4 rounded-2xl inline-block border border-slate-100 shadow-inner mb-6">
                    <div id="qrcode" class="flex justify-center"></div>
                </div>
                
                <button onclick="downloadQR()" 
                    class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition shadow-xl flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    Save QR to Device
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-md w-full mt-6 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex items-center gap-4">
        <div class="bg-blue-900 h-12 w-12 rounded-lg flex-shrink-0 flex items-center justify-center text-white text-xl">
            📘
        </div>
        <div class="flex-1 overflow-hidden">
            <h4 class="text-[13px] font-bold text-slate-800 truncate">Selling Property During Crisis</h4>
            <p class="text-[11px] text-slate-500 italic leading-tight">Master Real Estate Strategies</p>
        </div>
        <a href="https://torchcastro.gumroad.com/l/iusvgc" target="_blank" class="bg-blue-50 text-blue-600 font-bold text-[11px] px-4 py-2 rounded-lg hover:bg-blue-100 transition whitespace-nowrap">
            Get E-Book
        </a>
    </div>

    <script>
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            width: 220,
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function generateQR() {
            const url = document.getElementById("target-url").value;
            if(!url) return alert("Please paste a link first!");
            document.getElementById("qr-result").classList.remove("hidden");
            qrcode.clear();
            qrcode.makeCode(url);
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const canvas = document.querySelector('#qrcode canvas');
            let dataUrl;

            if (img && img.src.startsWith('data:image')) {
                dataUrl = img.src;
            } else if (canvas) {
                dataUrl = canvas.toDataURL("image/png");
            }

            if (dataUrl) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = 'qr-code.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
    </script>
</body>
</html>
